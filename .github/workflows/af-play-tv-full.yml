name: AF Play TV - JSON M3U Full Build

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: "URL JSON/M3U TV implicit"
        required: false
        default: "https://acasatv.co/zxy.json"
  push:
    branches: [dev]
    paths:
      - '.github/workflows/af-play-tv-full.yml'

permissions:
  contents: read

concurrency:
  group: af-play-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AF Play TV ARM APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYLIST_URL: ${{ inputs.playlist_url || 'https://acasatv.co/zxy.json' }}

    steps:
      - name: Checkout NuvioTV
        uses: actions/checkout@v4
        with:
          ref: dev
          submodules: recursive
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare local properties
        shell: bash
        run: |
          cat > local.properties <<'EOF'
          TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
          SIMKL_APP_NAME=afplay
          USE_LOCAL_FFMPEG_DECODER=false
          DOVI_NATIVE_ENABLED=false
          DOVI_EXTRACTOR_HOOK_READY=false
          DOVI_ENABLE_REAL_LINK=false
          SUPPORTERS_API_BASE_URL=https://nuvio.tv/
          SUPPORT_URL=https://nuvio.tv/support
          EOF
          touch local.dev.properties

      - name: Prepare CI signing
        shell: bash
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/afplay-tv.jks" \
            -storepass android \
            -alias afplaytv \
            -keypass android \
            -dname "CN=AF Play TV,O=AF Studio,C=IT" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/afplay-tv.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=afplaytv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Apply AF Play TV patch
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/afplay_tv_patch.b64" <<'AFPLAY_PATCH'
          
          AFPLAY_PATCH
          base64 --decode "$RUNNER_TEMP/afplay_tv_patch.b64" > "$RUNNER_TEMP/afplay_tv_patch.py"
          python3 - "$RUNNER_TEMP/afplay_tv_patch.py" "$PLAYLIST_URL" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          url = sys.argv[2]
          s = p.read_text(encoding='utf-8')
          s = s.replace('https://acasatv.co/zxy.json', url)
          p.write_text(s, encoding='utf-8')
          PY
          python3 "$RUNNER_TEMP/afplay_tv_patch.py"

      - name: Verify AF Play TV patch
        shell: bash
        run: |
          grep -F 'applicationId = "app.afplay.tv"' app/build.gradle.kts
          grep -F 'data object LiveTv : Screen("live_tv")' app/src/main/java/com/nuvio/tv/ui/navigation/Screen.kt
          grep -F 'Import JSON/M3U' app/src/main/java/com/nuvio/tv/ui/screens/livetv/LiveTvScreen.kt
          grep -F 'torrentio.strem.fun' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F 'All-in-One-Cynex' app/src/main/java/com/nuvio/tv/afplay/AfPlayBootstrap.kt
          grep -F "$PLAYLIST_URL" app/src/main/java/com/nuvio/tv/ui/screens/livetv/LiveTvScreen.kt

      - name: Build full debug ARM APKs
        env:
          CI_USE_DEBUG_SIGNING: 'false'
        run: ./gradlew :app:assembleFullDebug --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          ARM64="$(find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*arm64-v8a*debug*.apk' | head -n 1)"
          ARM32="$(find app/build/outputs/apk/full/debug -maxdepth 1 -type f -name '*armeabi-v7a*debug*.apk' | head -n 1)"
          test -n "$ARM64"
          test -n "$ARM32"
          cp "$ARM64" out/AF-Play-TV-arm64-v8a.apk
          cp "$ARM32" out/AF-Play-TV-armeabi-v7a.apk
          ls -lh out/*.apk

      - name: Upload AF Play TV APKs
        uses: actions/upload-artifact@v7
        with:
          name: AF-Play-TV-AndroidTV-FireTV
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14
